<!DOCTYPE html>
<html lang="fr" data-theme="day">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Onde — maquette</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=Outfit:wght@200;300;400&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   ONDE — maquette d'exploration visuelle
   Tous les paramètres visuels sont des variables en tête de fichier.
   (HTML/CSS pour valider le LOOK ; le moteur final sera canvas/WebGL.)
   ============================================================ */
:root{
  /* — Eau jour — */
  --water-day-1:#0a4a6e; --water-day-2:#1a8fa8; --water-day-3:#2dd4bf;
  /* — Eau nuit — */
  --water-night-1:#050d1a; --water-night-2:#0a2540; --water-night-3:#0d3b4a;
  /* — Lumière & accents — */
  --light:#e0f7ff; --accent:#5fd9c8; --ink:#dff3f0; --ink-dim:#8fb8be;

  /* — Réglages pilotables (panneau) — */
  --speed:1;          /* 0.3 .. 1.8  multiplicateur de vitesse */
  --density:1;        /* 0 .. 1      opacité globale de la nuée */

  /* — Police — */
  --geom:"Space Grotesk", system-ui, sans-serif;
  --thin:"Outfit", system-ui, sans-serif;

  /* — Profondeur lumineuse (modulée jour/nuit) — */
  --caustic-opacity:0.10;
  --ray-opacity:0.10;
  --bubble-opacity:0.5;
}
[data-theme="day"]{
  --w1:var(--water-day-1); --w2:var(--water-day-2); --w3:var(--water-day-3);
  --caustic-opacity:0.11; --ray-opacity:0.12; --bubble-opacity:0.55;
}
[data-theme="night"]{
  --w1:var(--water-night-1); --w2:var(--water-night-2); --w3:var(--water-night-3);
  --caustic-opacity:0.04; --ray-opacity:0.05; --bubble-opacity:0.28;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#02060c}
body{font-family:var(--thin);color:var(--ink)}

/* ============ SCÈNE / EAU ============ */
.stage{position:fixed;inset:0;overflow:hidden;
  background:linear-gradient(to bottom,var(--w1) 0%,var(--w2) 52%,var(--w3) 100%);
  transition:background 1.4s ease}

/* Caustiques : deux voiles clairs qui dérivent très lentement (<0.5px/frame) */
.caustics{position:absolute;inset:-30%;pointer-events:none;mix-blend-mode:screen;
  opacity:var(--caustic-opacity);transition:opacity 1.4s ease;
  background:
    radial-gradient(closest-side at 30% 30%, var(--light), transparent 60%),
    radial-gradient(closest-side at 70% 50%, var(--light), transparent 55%),
    radial-gradient(closest-side at 50% 75%, var(--light), transparent 60%),
    radial-gradient(closest-side at 85% 20%, var(--light), transparent 50%);
  background-size:55% 55%,45% 45%,60% 60%,40% 40%;
  filter:blur(8px);
  animation:caustic-drift 38s linear infinite}
.caustics.b{animation-duration:61s;animation-direction:reverse;opacity:calc(var(--caustic-opacity)*0.7)}
@keyframes caustic-drift{
  0%{transform:translate(0,0) scale(1)}
  50%{transform:translate(2%,1.5%) scale(1.06)}
  100%{transform:translate(0,0) scale(1)}}

/* God rays : faisceaux diagonaux additifs descendant de la surface */
.rays{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
  opacity:var(--ray-opacity);transition:opacity 1.4s ease;
  background:repeating-linear-gradient(108deg,
     transparent 0 60px, var(--light) 60px 64px, transparent 64px 150px);
  filter:blur(6px);
  transform-origin:top center;
  animation:ray-sway 16s ease-in-out infinite}
@keyframes ray-sway{0%,100%{transform:translateX(-2%) skewX(0deg)}50%{transform:translateX(2%) skewX(-1.2deg)}}

/* Vignette pour concentrer le regard */
.vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 38%, transparent 55%, rgba(2,8,16,.55) 100%)}

/* ============ BULLES ============ */
.bubbles{position:absolute;inset:0;pointer-events:none;opacity:var(--bubble-opacity);transition:opacity 1.4s}
.bubble{position:absolute;bottom:-40px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, rgba(224,247,255,.9), rgba(224,247,255,.05) 70%);
  box-shadow:0 0 6px rgba(224,247,255,.25);
  animation:rise linear infinite}
@keyframes rise{
  0%{transform:translate(0,0);opacity:0}
  12%{opacity:1}
  85%{opacity:.8}
  100%{transform:translate(var(--dx,12px),-104vh);opacity:0}}

/* ============ POISSONS ============ */
.school{position:absolute;inset:0;pointer-events:none;opacity:var(--density);transition:opacity .6s}
.fish{position:absolute;will-change:transform;
  animation:swim var(--dur,40s) ease-in-out infinite;
  animation-delay:var(--delay,0s)}
.fish svg{display:block;
  animation:tail calc(.9s / var(--speed)) ease-in-out infinite;
  transform-origin:75% 50%}
/* profondeur : poissons de fond floutés + atténués */
.fish.deep{filter:blur(2.5px);opacity:.55}
.fish.deep svg{animation-duration:calc(1.6s / var(--speed))}

/* Trajectoire « Bézier » approximée : translation + légère ondulation verticale.
   scaleX(-1) à mi-parcours pour retourner le poisson au demi-tour. */
@keyframes swim{
  0%   {transform:translate(-18vw, 0)        scaleX(1)}
  24%  {transform:translate(28vw, -6vh)      scaleX(1)}
  48%  {transform:translate(70vw,  4vh)      scaleX(1)}
  49%  {transform:translate(72vw,  4vh)      scaleX(-1)}
  73%  {transform:translate(34vw, 10vh)      scaleX(-1)}
  99%  {transform:translate(-18vw, 2vh)      scaleX(-1)}
  100% {transform:translate(-18vw, 2vh)      scaleX(1)}}
@keyframes tail{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

/* vitesse globale : on module la durée via --speed sur chaque poisson en JS-libre */
.fish{animation-duration:calc(var(--basedur,42s) / var(--speed))}

/* ============ UI MINIMALE ============ */
.ui{position:absolute;inset:0;pointer-events:none;transition:opacity .6s ease}
.ui>*{pointer-events:auto}
body.wallpaper .ui{opacity:0}

.wordmark{position:absolute;top:30px;left:34px;
  font-family:var(--geom);font-weight:300;font-size:.82rem;
  letter-spacing:.36em;color:var(--ink);text-transform:lowercase;
  text-shadow:0 1px 12px rgba(0,0,0,.35)}
.wordmark::after{content:"";display:block;width:26px;height:1px;margin-top:9px;
  background:var(--accent);opacity:.7}

.counter{position:absolute;top:24px;right:34px;text-align:right;
  text-shadow:0 1px 12px rgba(0,0,0,.35)}
.counter .num{font-family:var(--thin);font-weight:200;font-size:2.5rem;
  line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.counter .lbl{font-family:var(--geom);font-weight:400;font-size:.62rem;
  letter-spacing:.22em;text-transform:uppercase;color:var(--ink-dim);margin-top:4px}

.feed{position:absolute;left:50%;bottom:42px;transform:translateX(-50%);
  font-family:var(--geom);font-weight:400;font-size:.7rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink);
  padding:13px 30px;border-radius:40px;cursor:pointer;
  background:rgba(224,247,255,.06);
  border:1px solid rgba(224,247,255,.18);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:background .3s, transform .2s, border-color .3s}
.feed:hover{background:rgba(95,217,200,.16);border-color:rgba(95,217,200,.5)}
.feed:active{transform:translateX(-50%) scale(.96)}

/* engrenage réglages */
.gear{position:absolute;bottom:42px;right:34px;width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;color:var(--ink-dim);
  background:rgba(224,247,255,.05);border:1px solid rgba(224,247,255,.14);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:.3s}
.gear:hover{color:var(--ink);border-color:rgba(95,217,200,.5);transform:rotate(35deg)}

/* ============ PANNEAU DE RÉGLAGES (translucide) ============ */
.panel{position:absolute;bottom:96px;right:34px;width:248px;
  padding:22px 22px 24px;border-radius:18px;
  background:rgba(8,28,38,.55);
  border:1px solid rgba(224,247,255,.14);
  backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);
  box-shadow:0 18px 60px rgba(0,0,0,.45);
  opacity:0;transform:translateY(10px) scale(.98);pointer-events:none;
  transition:opacity .35s ease, transform .35s ease}
.panel.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.panel h3{font-family:var(--geom);font-weight:400;font-size:.64rem;letter-spacing:.24em;
  text-transform:uppercase;color:var(--ink-dim);margin-bottom:18px}
.row{margin-bottom:18px}
.row label{display:flex;justify-content:space-between;font-family:var(--geom);
  font-weight:300;font-size:.7rem;letter-spacing:.06em;color:var(--ink);margin-bottom:9px}
.row label span{color:var(--accent);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;
  background:rgba(224,247,255,.22);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
  border-radius:50%;background:var(--accent);cursor:pointer;
  box-shadow:0 0 0 4px rgba(95,217,200,.16)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;
  background:var(--accent);cursor:pointer}
.themes{display:flex;gap:8px;margin-top:4px}
.themes button{flex:1;font-family:var(--geom);font-weight:400;font-size:.62rem;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);cursor:pointer;
  padding:9px 0;border-radius:10px;background:transparent;
  border:1px solid rgba(224,247,255,.16);transition:.25s}
.themes button.active{color:#04141a;background:var(--accent);border-color:var(--accent)}

/* état vide : message contemplatif quasi invisible */
.empty-note{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  text-align:center;font-family:var(--thin);font-weight:200;color:var(--ink-dim);
  letter-spacing:.18em;font-size:.78rem;opacity:0;transition:opacity 1s;pointer-events:none}
body.empty .empty-note{opacity:.5}
body.empty .school{opacity:0 !important}

/* ============ SÉLECTEUR D'ÉCRAN (méta-maquette, hors produit) ============ */
.screens{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:50;
  display:flex;gap:6px;padding:5px;border-radius:30px;
  background:rgba(4,12,20,.5);border:1px solid rgba(224,247,255,.12);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.screens button{font-family:var(--geom);font-weight:400;font-size:.6rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-dim);cursor:pointer;padding:8px 14px;
  border:none;border-radius:24px;background:transparent;transition:.25s}
.screens button.active{color:#04141a;background:var(--accent)}
.hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:50;
  font-family:var(--geom);font-weight:300;font-size:.58rem;letter-spacing:.1em;
  color:var(--ink-dim);opacity:.5}
</style>
</head>
<body data-screen="aquarium">

  <!-- Sélecteur d'écran : outil de la maquette, ne fait pas partie du produit -->
  <nav class="screens">
    <button data-go="aquarium" class="active">Aquarium</button>
    <button data-go="settings">Réglages</button>
    <button data-go="empty">Vide / Nuit</button>
  </nav>

  <main class="stage">
    <div class="caustics"></div>
    <div class="caustics b"></div>
    <div class="rays"></div>
    <div class="bubbles" id="bubbles"></div>
    <div class="school" id="school"></div>
    <div class="vignette"></div>

    <!-- UI minimale -->
    <div class="ui">
      <div class="wordmark" id="wordmark">onde</div>

      <div class="counter">
        <div class="num" id="count">12</div>
        <div class="lbl">poissons</div>
      </div>

      <div class="empty-note">l'eau au repos.</div>

      <button class="feed" id="feed">Nourrir</button>

      <div class="gear" id="gear" title="Réglages">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>
        </svg>
      </div>

      <!-- Panneau réglages -->
      <div class="panel" id="panel">
        <h3>Réglages</h3>
        <div class="row">
          <label>Vitesse <span id="vSpeed">1.0×</span></label>
          <input type="range" id="rSpeed" min="0.3" max="1.8" step="0.1" value="1">
        </div>
        <div class="row">
          <label>Densité <span id="vDens">12</span></label>
          <input type="range" id="rDens" min="0" max="18" step="1" value="12">
        </div>
        <div class="row">
          <label>Thème</label>
          <div class="themes">
            <button data-theme-btn="day" class="active">Jour</button>
            <button data-theme-btn="night">Nuit</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="hint">Survol de l'engrenage = réglages · « Vide / Nuit » = mode contemplatif</div>

<script>
/* ============================================================
   Maquette interactive — logique légère (pas le moteur final)
   ============================================================ */
const root = document.documentElement;
const body = document.body;

/* — Définition des 4 espèces (silhouettes SVG flat, dégradés doux) — */
const SPECIES = {
  voile: { w:120, h:64, base:42, deep:false, svg:`
    <defs><linearGradient id="gv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe9d8"/><stop offset="1" stop-color="#1a8fa8"/></linearGradient></defs>
    <path d="M14 32 C40 6, 92 6, 110 32 C92 58, 40 58, 14 32 Z" fill="url(#gv)"/>
    <path d="M14 32 C2 18, 2 46, 14 32 C24 26, 24 38, 14 32 Z" fill="#7fe9d8" opacity=".85"/>
    <path d="M110 32 q14 -16 22 -8 q-10 8 -22 8 q12 6 22 8 q-8 8 -22 -8" fill="#7fe9d8" opacity=".55"/>
    <circle cx="98" cy="28" r="2.4" fill="#04222b"/>` },
  lame: { w:78, h:92, base:52, deep:false, svg:`
    <defs><linearGradient id="gl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f7ff"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient></defs>
    <path d="M40 8 C58 30, 70 44, 60 70 C50 86, 30 86, 22 70 C14 50, 26 30, 40 8 Z" fill="url(#gl)"/>
    <path d="M22 70 q-12 14 -16 8 q6 -10 16 -8" fill="#2dd4bf" opacity=".6"/>
    <circle cx="36" cy="30" r="2.2" fill="#04222b"/>` },
  vif: { w:60, h:30, base:30, deep:false, svg:`
    <defs><linearGradient id="gf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bff3ea"/><stop offset="1" stop-color="#5fd9c8"/></linearGradient></defs>
    <path d="M6 15 C20 4, 44 4, 52 15 C44 26, 20 26, 6 15 Z" fill="url(#gf)"/>
    <path d="M52 15 l10 -7 v14 z" fill="#5fd9c8" opacity=".7"/>
    <circle cx="44" cy="13" r="1.6" fill="#04222b"/>` },
  planeur: { w:130, h:60, base:64, deep:true, svg:`
    <defs><radialGradient id="gp" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#0e5a6e"/><stop offset="1" stop-color="#072c3a"/></radialGradient></defs>
    <path d="M65 14 C108 14, 124 30, 124 30 C124 30, 108 46, 65 46 C22 46, 6 30, 6 30 C6 30, 22 14, 65 14 Z" fill="url(#gp)"/>
    <path d="M65 46 q2 18 -2 22 q-2 -12 2 -22" fill="#072c3a"/>` }
};

/* Compose la nuée : un mix pondéré des espèces */
const PLAN = ['planeur','voile','lame','vif','vif','voile','vif','lame','vif','vif','voile','vif',
              'lame','vif','vif','planeur','vif','voile'];

const school = document.getElementById('school');
function buildSchool(n){
  school.innerHTML='';
  for(let i=0;i<n;i++){
    const key = PLAN[i % PLAN.length];
    const s = SPECIES[key];
    const el = document.createElement('div');
    el.className = 'fish' + (s.deep ? ' deep' : '');
    const scale = (0.55 + Math.random()*0.7) * (s.deep ? 1.15 : 1);
    const top = 8 + Math.random()*78;            // position verticale de la trajectoire
    const dur = (s.base + Math.random()*22);     // durée de base (s)
    el.style.top = top+'vh';
    el.style.setProperty('--basedur', dur+'s');
    el.style.animationDelay = (-Math.random()*dur)+'s';
    el.innerHTML = `<svg width="${s.w*scale}" height="${s.h*scale}" viewBox="0 0 ${s.w} ${s.h}">${s.svg}</svg>`;
    school.appendChild(el);
  }
}

/* Bulles */
const bubbles = document.getElementById('bubbles');
function buildBubbles(n){
  bubbles.innerHTML='';
  for(let i=0;i<n;i++){
    const b=document.createElement('div');b.className='bubble';
    const size=2+Math.random()*7;
    b.style.width=b.style.height=size+'px';
    b.style.left=Math.random()*100+'vw';
    b.style.setProperty('--dx',(Math.random()*40-20)+'px');
    const dur=8+Math.random()*12;
    b.style.animationDuration=dur+'s';
    b.style.animationDelay=(-Math.random()*dur)+'s';
    bubbles.appendChild(b);
  }
}

/* — Réglages — */
const count = document.getElementById('count');
const rSpeed=document.getElementById('rSpeed'), vSpeed=document.getElementById('vSpeed');
const rDens =document.getElementById('rDens'),  vDens =document.getElementById('vDens');

function applySpeed(v){ root.style.setProperty('--speed',v); vSpeed.textContent=Number(v).toFixed(1)+'×'; }
function applyDensity(n){
  n=+n; vDens.textContent=n; count.textContent=n;
  root.style.setProperty('--density', n===0?0:1);
  buildSchool(n);
}
rSpeed.oninput=e=>applySpeed(e.target.value);
rDens .oninput=e=>applyDensity(e.target.value);

/* — Thème jour/nuit — */
function setTheme(t){
  root.setAttribute('data-theme',t);
  document.querySelectorAll('[data-theme-btn]').forEach(b=>
    b.classList.toggle('active', b.dataset.themeBtn===t));
}
document.querySelectorAll('[data-theme-btn]').forEach(b=>
  b.onclick=()=>setTheme(b.dataset.themeBtn));

/* — Panneau réglages (clic + survol engrenage) — */
const panel=document.getElementById('panel'), gear=document.getElementById('gear');
gear.onclick=()=>panel.classList.toggle('open');
gear.onmouseenter=()=>panel.classList.add('open');

/* — Bouton Nourrir : pulse de bulles + petit afflux — */
const feed=document.getElementById('feed');
feed.onclick=()=>{
  for(let i=0;i<14;i++){
    const b=document.createElement('div');b.className='bubble';
    const size=2+Math.random()*5;
    b.style.width=b.style.height=size+'px';
    b.style.left=(45+Math.random()*10)+'vw';
    b.style.bottom='14vh';
    b.style.setProperty('--dx',(Math.random()*120-60)+'px');
    b.style.animationDuration=(3+Math.random()*3)+'s';
    bubbles.appendChild(b);
    setTimeout(()=>b.remove(),6000);
  }
};

/* — Sélecteur d'écran (maquette) — */
const goBtns=document.querySelectorAll('.screens button');
function go(screen){
  body.dataset.screen=screen;
  goBtns.forEach(b=>b.classList.toggle('active', b.dataset.go===screen));
  body.classList.remove('empty');
  panel.classList.remove('open');
  if(screen==='aquarium'){ setTheme('day'); }
  if(screen==='settings'){ setTheme('day'); panel.classList.add('open'); }
  if(screen==='empty'){ setTheme('night'); body.classList.add('empty'); }
}
goBtns.forEach(b=>b.onclick=()=>go(b.dataset.go));

/* — Init — */
buildBubbles(34);
applyDensity(12);
applySpeed(1);
</script>
</body>
</html>
