<!DOCTYPE html>
<html lang="fr" data-theme="day">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Onde</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=Outfit:wght@200;300;400&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   ONDE — aquarium d'ambiance, moteur WebGL temps réel
   Direction visuelle : voir DESIGN.md / styleguide.html
   Tous les tokens visuels sont en tête de :root et dans THEMES (JS).
   ============================================================ */
:root{
  --accent:#5fd9c8; --ink:#dff3f0; --ink-dim:#8fb8be;
  --geom:"Space Grotesk", system-ui, sans-serif;
  --thin:"Outfit", system-ui, sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#02060c}
body{font-family:var(--thin);color:var(--ink);-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}

/* ============ UI MINIMALE ============ */
.ui{position:fixed;inset:0;pointer-events:none;transition:opacity 1s ease;z-index:10}
.ui>*{pointer-events:auto}
body.wallpaper .ui{opacity:0}

.wordmark{position:absolute;top:30px;left:34px;
  font-family:var(--geom);font-weight:300;font-size:.82rem;
  letter-spacing:.36em;color:var(--ink);text-transform:lowercase;
  text-shadow:0 1px 14px rgba(0,0,0,.4)}
.wordmark::after{content:"";display:block;width:26px;height:1px;margin-top:9px;
  background:var(--accent);opacity:.7}

.counter{position:absolute;top:24px;right:34px;text-align:right;
  text-shadow:0 1px 14px rgba(0,0,0,.4)}
.counter .num{font-family:var(--thin);font-weight:200;font-size:2.5rem;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.counter .lbl{font-family:var(--geom);font-weight:400;font-size:.62rem;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ink-dim);margin-top:4px}

.feed{position:absolute;left:50%;bottom:42px;transform:translateX(-50%);
  font-family:var(--geom);font-weight:400;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink);padding:13px 30px;border-radius:40px;cursor:pointer;
  background:rgba(224,247,255,.06);border:1px solid rgba(224,247,255,.18);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:background .3s,transform .15s,border-color .3s}
.feed:hover{background:rgba(95,217,200,.16);border-color:rgba(95,217,200,.5)}
.feed:active{transform:translateX(-50%) scale(.95)}

.gear{position:absolute;bottom:42px;right:34px;width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;color:var(--ink-dim);
  background:rgba(224,247,255,.05);border:1px solid rgba(224,247,255,.14);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:.35s}
.gear:hover{color:var(--ink);border-color:rgba(95,217,200,.5);transform:rotate(40deg)}

.panel{position:absolute;bottom:96px;right:34px;width:250px;padding:22px 22px 24px;border-radius:18px;
  background:rgba(8,28,38,.5);border:1px solid rgba(224,247,255,.14);
  backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);
  box-shadow:0 18px 60px rgba(0,0,0,.45);
  opacity:0;transform:translateY(10px) scale(.98);pointer-events:none;
  transition:opacity .35s ease,transform .35s ease}
.panel.open{opacity:1;transform:none;pointer-events:auto}
.panel h3{font-family:var(--geom);font-weight:400;font-size:.64rem;letter-spacing:.24em;
  text-transform:uppercase;color:var(--ink-dim);margin-bottom:18px}
.row{margin-bottom:18px}
.row label{display:flex;justify-content:space-between;font-family:var(--geom);font-weight:300;
  font-size:.7rem;letter-spacing:.06em;color:var(--ink);margin-bottom:9px}
.row label span{color:var(--accent);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;
  background:rgba(224,247,255,.22);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--accent);cursor:pointer;box-shadow:0 0 0 4px rgba(95,217,200,.16)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;
  background:var(--accent);cursor:pointer}
.themes{display:flex;gap:8px;margin-top:4px}
.themes button{flex:1;font-family:var(--geom);font-weight:400;font-size:.62rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-dim);cursor:pointer;padding:9px 0;border-radius:10px;
  background:transparent;border:1px solid rgba(224,247,255,.16);transition:.25s}
.themes button.active{color:#04141a;background:var(--accent);border-color:var(--accent)}

.hint{position:fixed;bottom:13px;left:50%;transform:translateX(-50%);z-index:10;
  font-family:var(--geom);font-weight:300;font-size:.58rem;letter-spacing:.1em;color:var(--ink-dim);
  opacity:.45;transition:opacity 1s}
body.wallpaper .hint{opacity:0}
.fallback{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:40px;
  font-family:var(--geom);font-weight:300;color:var(--ink-dim);line-height:1.7;z-index:20}
.fallback a{color:var(--accent)}
</style>
</head>
<body data-theme="day">
<canvas id="gl"></canvas>

<div class="ui">
  <div class="wordmark">onde</div>
  <div class="counter"><div class="num" id="count">0</div><div class="lbl">poissons</div></div>
  <button class="feed" id="feed">Nourrir</button>
  <div class="gear" id="gear" title="Réglages">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
      <circle cx="12" cy="12" r="3"/>
      <path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>
    </svg>
  </div>
  <div class="panel" id="panel">
    <h3>Réglages</h3>
    <div class="row"><label>Vitesse <span id="vSpeed">1.0×</span></label>
      <input type="range" id="rSpeed" min="0.3" max="1.8" step="0.05" value="1"></div>
    <div class="row"><label>Densité <span id="vDens">24</span></label>
      <input type="range" id="rDens" min="0" max="60" step="1" value="24"></div>
    <div class="row"><label>Thème</label>
      <div class="themes">
        <button data-theme-btn="day" class="active">Jour</button>
        <button data-theme-btn="night">Nuit</button>
      </div>
    </div>
  </div>
</div>
<div class="hint">Engrenage : réglages · double-clic : mode fond d'écran</div>
<div class="fallback" id="fallback">WebGL indisponible sur cet appareil.<br>Voir la maquette de style : <a href="styleguide.html">styleguide.html</a></div>

<script>
"use strict";
/* ============================================================
   0. Setup WebGL
   ============================================================ */
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', {antialias:true, alpha:false, premultipliedAlpha:false})
        || canvas.getContext('experimental-webgl');
if(!gl){ document.getElementById('fallback').style.display='grid'; throw new Error('no webgl'); }

const DPR = Math.min(window.devicePixelRatio||1, 1.75);
let W=0,H=0,ASPECT=1;

function compile(type, src){
  const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)+'\n'+src);
  return s;
}
function program(vs,fs){
  const p=gl.createProgram();
  gl.attachShader(p,compile(gl.VERTEX_SHADER,vs));
  gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  // cache locations
  p.u={}; p.a={};
  const nu=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<nu;i++){const inf=gl.getActiveUniform(p,i);p.u[inf.name]=gl.getUniformLocation(p,inf.name);}
  const na=gl.getProgramParameter(p,gl.ACTIVE_ATTRIBUTES);
  for(let i=0;i<na;i++){const inf=gl.getActiveAttrib(p,i);p.a[inf.name]=gl.getAttribLocation(p,inf.name);}
  return p;
}
function fbo(w,h){
  const tex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const fb=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  return {tex,fb,w,h};
}

/* fullscreen triangle */
const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,quad);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 3,-1, -1,3]),gl.STATIC_DRAW);
function drawQuad(p){
  gl.bindBuffer(gl.ARRAY_BUFFER,quad);
  gl.enableVertexAttribArray(p.a.aPos);
  gl.vertexAttribPointer(p.a.aPos,2,gl.FLOAT,false,0,0);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

/* ============================================================
   1. Shaders
   ============================================================ */
const VS_QUAD = `attribute vec2 aPos; varying vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position=vec4(aPos,0.,1.); }`;

const FS_BG = `precision highp float;
varying vec2 vUv;
uniform float uTime; uniform vec2 uRes;
uniform vec3 uTop,uMid,uBot,uLight;
uniform float uCaustic,uRay;
#define TAU 6.28318530718
// caustiques (technique itérative classique, domaine ondulé)
float caustic(vec2 uv,float t){
  vec2 p = mod(uv*TAU, TAU) - 250.0;
  vec2 i = p; float c=1.0; float inten=0.005;
  for(int n=0;n<5;n++){
    float tt = t*(1.0-(3.5/float(n+1)));
    i = p + vec2(cos(tt-i.x)+sin(tt+i.y), sin(tt-i.y)+cos(tt+i.x));
    c += 1.0/length(vec2(p.x/(sin(i.x+tt)/inten), p.y/(cos(i.y+tt)/inten)));
  }
  c/=5.0; c=1.17-pow(c,1.4);
  return clamp(pow(abs(c),8.0),0.0,1.0);
}
float godrays(vec2 uv,float t){
  float perp = uv.x + (1.0-uv.y)*0.18;
  float acc=0.0;
  for(int i=0;i<3;i++){ float fi=float(i);
    float band = sin(perp*9.0 + fi*2.1 + t*0.05);
    acc += smoothstep(0.25,1.0,band)*(0.5+0.3*sin(t*0.1+fi)); }
  return acc * smoothstep(0.0,0.65,uv.y);
}
void main(){
  float depth = 1.0 - vUv.y;            // 0 surface .. 1 fond
  vec3 col = mix(uTop,uMid, smoothstep(0.0,0.5,depth));
  col = mix(col,uBot, smoothstep(0.5,1.0,depth));
  vec2 cuv = vUv * vec2(uRes.x/uRes.y,1.0);
  float c = caustic(cuv*2.2 + vec2(0.0,uTime*0.02), uTime*0.45);
  col += uLight * c * uCaustic * smoothstep(1.0,0.1,depth);
  col += uLight * godrays(vUv,uTime) * uRay;
  // grain de profondeur très léger
  col *= 1.0 - 0.04*depth;
  gl_FragColor = vec4(col,1.0);
}`;

const VS_FISH = `precision highp float;
attribute vec2 aPos;  // x le long du corps [-0.5,0.5], yEdge
attribute float aU;   // 0 queue .. 1 tete
attribute float aSide;// -1 ventre .. +1 dos
uniform vec2 uPos; uniform float uScale,uHeading,uMirror,uAspect,uPhase,uAmp,uWaveK;
varying float vGrad,vU,vSide;
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
void main(){
  float tail = 1.0-aU; tail*=tail;                 // ondulation max a la queue
  float spine = sin(aU*uWaveK - uPhase)*uAmp*tail;
  vec2 g = vec2(aPos.x, (aPos.y+spine)*uMirror)*uScale;
  vec2 r = rot(uHeading)*g;
  vec2 pos = uPos + vec2(r.x/uAspect, r.y);
  gl_Position = vec4(pos*2.0-1.0,0.,1.);
  vGrad = aSide*0.5+0.5; vU=aU; vSide=aSide;
}`;

const FS_FISH = `precision highp float;
varying float vGrad,vU,vSide;
uniform vec3 uDorsal,uBelly,uTint; uniform float uFog,uAlpha,uSoft;
void main(){
  float a = 1.0 - smoothstep(1.0-uSoft, 1.0, abs(vSide));   // bords doux (DoF)
  vec3 col = mix(uBelly,uDorsal, smoothstep(0.0,1.0,vGrad));
  col += vec3(0.05)*smoothstep(0.72,1.0,vGrad);             // liseré dorsal
  float eye = distance(vec2(vU,vGrad), vec2(0.83,0.60));
  col = mix(col, vec3(0.02,0.06,0.08), smoothstep(0.045,0.0,eye));
  col = mix(col, uTint, uFog);                              // brume de profondeur
  gl_FragColor = vec4(col, a*uAlpha);
}`;

const VS_PT = `precision highp float;
attribute vec2 aPos; attribute float aSize;
void main(){ gl_Position=vec4(aPos*2.0-1.0,0.,1.); gl_PointSize=aSize; }`;
const FS_BUBBLE = `precision highp float; uniform vec3 uLight;
void main(){ vec2 c=gl_PointCoord-0.5; float d=length(c);
  float a=smoothstep(0.5,0.12,d); float rim=smoothstep(0.5,0.40,d);
  gl_FragColor=vec4(uLight*(0.45+0.7*rim), a*0.5); }`;
const FS_FOOD = `precision highp float;
void main(){ vec2 c=gl_PointCoord-0.5; float d=length(c);
  float a=smoothstep(0.5,0.1,d);
  gl_FragColor=vec4(vec3(0.85,0.78,0.55)*0.9, a*0.85); }`;

const FS_BRIGHT = `precision highp float; varying vec2 vUv; uniform sampler2D uTex;
void main(){ vec3 c=texture2D(uTex,vUv).rgb;
  float l=dot(c,vec3(0.299,0.587,0.114));
  gl_FragColor=vec4(c*smoothstep(0.55,0.9,l),1.0); }`;
const FS_BLUR = `precision highp float; varying vec2 vUv;
uniform sampler2D uTex; uniform vec2 uDir;
void main(){ vec3 s=vec3(0.0);
  s+=texture2D(uTex,vUv).rgb*0.227;
  s+=texture2D(uTex,vUv+uDir*1.385).rgb*0.316;
  s+=texture2D(uTex,vUv-uDir*1.385).rgb*0.316;
  s+=texture2D(uTex,vUv+uDir*3.231).rgb*0.070;
  s+=texture2D(uTex,vUv-uDir*3.231).rgb*0.070;
  gl_FragColor=vec4(s,1.0); }`;
const FS_COMP = `precision highp float; varying vec2 vUv;
uniform sampler2D uScene,uBloom; uniform float uBloomAmt,uTime;
float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5); }
void main(){
  vec3 col = texture2D(uScene,vUv).rgb + texture2D(uBloom,vUv).rgb*uBloomAmt;
  col = 1.0 - exp(-col*1.06);                              // tone map doux
  float v = smoothstep(1.25,0.35, length((vUv-0.5)*vec2(1.1,1.0)));
  col *= mix(0.72,1.0,v);                                  // vignette
  col += (hash(vUv+uTime)-0.5)*0.022;                      // grain fin
  gl_FragColor = vec4(col,1.0);
}`;

const pBG=program(VS_QUAD,FS_BG), pFISH=program(VS_FISH,FS_FISH),
      pBUB=program(VS_PT,FS_BUBBLE), pFOOD=program(VS_PT,FS_FOOD),
      pBRIGHT=program(VS_QUAD,FS_BRIGHT), pBLUR=program(VS_QUAD,FS_BLUR),
      pCOMP=program(VS_QUAD,FS_COMP);

/* ============================================================
   2. Géométrie des poissons (silhouettes flat)
   ============================================================ */
function edges(u,p){
  let s = Math.pow(Math.max(0,Math.sin(Math.PI*Math.pow(u,p.head))), p.taper);
  let h = s*p.height;
  const dor = p.dorsalH*Math.exp(-Math.pow((u-p.dorsalU)/p.dorsalW,2));
  const anl = p.analH  *Math.exp(-Math.pow((u-p.analU)/p.analW,2));
  let caud=0; if(u<p.tailEnd){ const t=(p.tailEnd-u)/p.tailEnd; caud=p.tailH*Math.pow(t,0.7); }
  return { top:  h*p.topScale + dor + caud,
           bot:-(h*p.botScale + anl + caud) };
}
function buildFishGeom(p){
  const seg=72, arr=[];
  for(let i=0;i<=seg;i++){
    const u=i/seg, x=u-0.5, e=edges(u,p);
    arr.push(x,e.top,u,1.0, x,e.bot,u,-1.0);
  }
  const buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(arr),gl.STATIC_DRAW);
  return {buf, count:(seg+1)*2};
}

// hex -> vec3 [0..1]
const hex=h=>[parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255];

const SPECIES = {
  voile:{ // koï à voiles — pièce maîtresse, premier plan, lent
    geomP:{head:.85,taper:.8,height:.16,topScale:1,botScale:1,dorsalH:.03,dorsalU:.55,dorsalW:.25,
           analH:.02,analU:.55,analW:.25,tailEnd:.16,tailH:.20},
    len:.24, dorsal:'#1a8fa8', belly:'#7fe9d8',
    maxSpeed:.045, wave:6.0, tailRate:7, sep:.05, ali:.2, coh:.2, depthFog:.18, weightCount:.22 },
  lame:{ // poisson-ange — verticalité
    geomP:{head:1.0,taper:.7,height:.5,topScale:1,botScale:1,dorsalH:.34,dorsalU:.5,dorsalW:.34,
           analH:.34,analU:.5,analW:.34,tailEnd:.12,tailH:.16},
    len:.115, dorsal:'#2dd4bf', belly:'#e0f7ff',
    maxSpeed:.07, wave:6.5, tailRate:8, sep:.05, ali:.25, coh:.25, depthFog:.16, weightCount:.2 },
  vif:{ // tétra — nuée, scintillement, rapide
    geomP:{head:.8,taper:.9,height:.3,topScale:1,botScale:1,dorsalH:.05,dorsalU:.5,dorsalW:.2,
           analH:.04,analU:.55,analW:.2,tailEnd:.18,tailH:.26},
    len:.06, dorsal:'#5fd9c8', belly:'#bff3ea',
    maxSpeed:.14, wave:7.5, tailRate:11, sep:.035, ali:1.1, coh:.9, depthFog:.14, weightCount:.46 },
  planeur:{ // cruiser de fond — calme, flou de profondeur
    geomP:{head:.9,taper:.6,height:.14,topScale:.7,botScale:.7,dorsalH:.02,dorsalU:.5,dorsalW:.3,
           analH:.02,analU:.5,analW:.3,tailEnd:.2,tailH:.12},
    len:.28, dorsal:'#0e5a6e', belly:'#0a3a48',
    maxSpeed:.03, wave:5.0, tailRate:5, sep:.07, ali:.1, coh:.1, depthFog:.5, weightCount:.12,
    band:[.62,.92] }
};
for(const k in SPECIES){ const s=SPECIES[k];
  s.geom=buildFishGeom(s.geomP); s.dCol=hex(s.dorsal); s.bCol=hex(s.belly); }

/* ============================================================
   3. Population (boids)
   ============================================================ */
const fishes=[];
const rnd=(a,b)=>a+Math.random()*(b-a);
function pickSpecies(){
  let r=Math.random(),acc=0;
  for(const k in SPECIES){ acc+=SPECIES[k].weightCount; if(r<=acc) return k; }
  return 'vif';
}
function makeFish(){
  const key=pickSpecies(), s=SPECIES[key];
  const band=s.band||[.12,.9];
  return { key, x:rnd(.1,.9), y:rnd(band[0],band[1]),
    vx:rnd(-1,1)*s.maxSpeed, vy:rnd(-1,1)*s.maxSpeed*.4,
    phase:rnd(0,6.28), depth:rnd(0,1), scale:rnd(.82,1.18), wob:rnd(0,6.28) };
}
function setDensity(n){
  n=Math.max(0,Math.round(n));
  while(fishes.length<n) fishes.push(makeFish());
  if(fishes.length>n) fishes.length=n;
  document.getElementById('count').textContent=n;
}

const foods=[];
function feed(){
  for(let i=0;i<10;i++) foods.push({x:rnd(.4,.6),y:rnd(.92,.98),vy:rnd(.04,.07),vx:rnd(-.01,.01)});
  for(let i=0;i<14;i++) spawnBubble(rnd(.45,.55), .12, rnd(2,5), true);
}

/* bulles */
const bubbles=[];
function spawnBubble(x,y,r,fast){ bubbles.push({x,y,r,vy:(fast?rnd(.12,.2):rnd(.03,.09)),
  drift:rnd(-.02,.02), ph:rnd(0,6.28), life:fast?1:0}); }
for(let i=0;i<40;i++) spawnBubble(Math.random(), Math.random(), rnd(1.5,5), false);

let globalSpeed=1;
function stepBoids(dt){
  for(let i=0;i<fishes.length;i++){
    const f=fishes[i], s=SPECIES[f.key];
    let ax=0,ay=0, cx=0,cy=0, avx=0,avy=0, sx=0,sy=0, n=0;
    for(let j=0;j<fishes.length;j++){
      if(i===j||fishes[j].key!==f.key) continue;
      const o=fishes[j], dx=o.x-f.x, dy=o.y-f.y, d2=dx*dx+dy*dy;
      if(d2<0.05){ const d=Math.sqrt(d2)+1e-4;
        cx+=o.x;cy+=o.y; avx+=o.vx;avy+=o.vy; n++;
        if(d<s.sep){ sx-=dx/d; sy-=dy/d; } }
    }
    if(n>0){ cx/=n;cy/=n; ax+=(cx-f.x)*s.coh; ay+=(cy-f.y)*s.coh;
      ax+=(avx/n-f.vx)*s.ali; ay+=(avy/n-f.vy)*s.ali;
      ax+=sx*0.9; ay+=sy*0.9; }
    // errance
    f.wob+=dt*rnd(.8,1.4); ax+=Math.cos(f.wob)*s.maxSpeed*0.6; ay+=Math.sin(f.wob*1.3)*s.maxSpeed*0.4;
    // bornes
    const m=.07;
    if(f.x<m) ax+=(m-f.x)*1.5; if(f.x>1-m) ax-=(f.x-(1-m))*1.5;
    const band=s.band||[.08,.92];
    if(f.y<band[0]) ay+=(band[0]-f.y)*1.6; if(f.y>band[1]) ay-=(f.y-band[1])*1.6;
    // nourriture
    let best=-1,bd=1e9;
    for(let k=0;k<foods.length;k++){ const fo=foods[k];
      const dx=fo.x-f.x, dy=fo.y-f.y, d2=dx*dx+dy*dy;
      if(d2<0.09 && d2<bd){ bd=d2; best=k; } }
    if(best>=0){ const fo=foods[best], d=Math.sqrt(bd)+1e-4;
      ax+=(fo.x-f.x)/d*s.maxSpeed*4.0; ay+=(fo.y-f.y)/d*s.maxSpeed*4.0;
      if(bd<0.0009){ foods.splice(best,1); spawnBubble(f.x,f.y,2.5,true); } }
    // intégration
    f.vx+=ax*dt; f.vy+=ay*dt;
    const sp=Math.hypot(f.vx,f.vy), max=s.maxSpeed*globalSpeed;
    if(sp>max){ f.vx=f.vx/sp*max; f.vy=f.vy/sp*max; }
    f.x+=f.vx*dt; f.y+=f.vy*dt;
    f.phase+=(0.3+ (sp/(s.maxSpeed||1)) )*s.tailRate*dt;
  }
  // bulles
  for(let i=bubbles.length-1;i>=0;i--){ const b=bubbles[i];
    b.ph+=dt; b.y+=b.vy*globalSpeed*dt; b.x+=Math.sin(b.ph)*0.0008+b.drift*dt;
    if(b.y>1.05){ if(b.life){ bubbles.splice(i,1); continue; } b.y=-0.05; b.x=Math.random(); } }
  while(bubbles.filter(b=>!b.life).length<40) spawnBubble(Math.random(),-0.05,rnd(1.5,5),false);
  // nourriture qui tombe
  for(let i=foods.length-1;i>=0;i--){ const fo=foods[i];
    fo.y-=fo.vy*dt; fo.x+=fo.vx*dt; fo.vy*=0.997;
    if(fo.y<.04) foods.splice(i,1); }
}

/* ============================================================
   4. Thèmes (interpolés en douceur)
   ============================================================ */
const THEMES={
  day:{ top:hex('#0a4a6e'), mid:hex('#1a8fa8'), bot:hex('#2dd4bf'),
        light:hex('#e0f7ff'), caustic:0.16, ray:0.05, bubble:0.55 },
  night:{ top:hex('#050d1a'), mid:hex('#0a2540'), bot:hex('#0d3b4a'),
        light:hex('#e0f7ff'), caustic:0.05, ray:0.015, bubble:0.3 }
};
const cur={ top:THEMES.day.top.slice(), mid:THEMES.day.mid.slice(), bot:THEMES.day.bot.slice(),
  light:THEMES.day.light.slice(), caustic:.16, ray:.05, bubble:.55 };
let tgt=THEMES.day;
function lerp(a,b,t){return a+(b-a)*t;}
function stepTheme(dt){ const k=Math.min(1,dt*2.2);
  for(let i=0;i<3;i++){ cur.top[i]=lerp(cur.top[i],tgt.top[i],k);
    cur.mid[i]=lerp(cur.mid[i],tgt.mid[i],k); cur.bot[i]=lerp(cur.bot[i],tgt.bot[i],k);
    cur.light[i]=lerp(cur.light[i],tgt.light[i],k); }
  cur.caustic=lerp(cur.caustic,tgt.caustic,k); cur.ray=lerp(cur.ray,tgt.ray,k);
  cur.bubble=lerp(cur.bubble,tgt.bubble,k); }

/* ============================================================
   5. Rendu
   ============================================================ */
let sceneFBO,brightFBO,blurA,blurB,usePost=true;
function resize(){
  W=Math.floor(canvas.clientWidth*DPR); H=Math.floor(canvas.clientHeight*DPR);
  if(W===0||H===0) return;
  canvas.width=W; canvas.height=H; ASPECT=W/H;
  const bw=Math.max(1,W>>1), bh=Math.max(1,H>>1);
  sceneFBO=fbo(W,H); brightFBO=fbo(bw,bh); blurA=fbo(bw,bh); blurB=fbo(bw,bh);
  gl.bindFramebuffer(gl.FRAMEBUFFER,sceneFBO.fb);
  usePost = gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE;
}
window.addEventListener('resize',resize);

const dynBuf=gl.createBuffer();
function drawPoints(p, list, sizeOf, extraUniform){
  if(!list.length) return;
  const arr=new Float32Array(list.length*3);
  for(let i=0;i<list.length;i++){ const o=list[i];
    arr[i*3]=o.x; arr[i*3+1]=o.y; arr[i*3+2]=sizeOf(o); }
  gl.useProgram(p); if(extraUniform) extraUniform(p);
  gl.bindBuffer(gl.ARRAY_BUFFER,dynBuf);
  gl.bufferData(gl.ARRAY_BUFFER,arr,gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(p.a.aPos); gl.vertexAttribPointer(p.a.aPos,2,gl.FLOAT,false,12,0);
  gl.enableVertexAttribArray(p.a.aSize); gl.vertexAttribPointer(p.a.aSize,1,gl.FLOAT,false,12,8);
  gl.drawArrays(gl.POINTS,0,list.length);
}

function drawScene(time){
  gl.viewport(0,0,W,H);
  gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  // fond
  gl.disable(gl.BLEND);
  gl.useProgram(pBG);
  gl.uniform1f(pBG.u.uTime,time); gl.uniform2f(pBG.u.uRes,W,H);
  gl.uniform3fv(pBG.u.uTop,cur.top); gl.uniform3fv(pBG.u.uMid,cur.mid);
  gl.uniform3fv(pBG.u.uBot,cur.bot); gl.uniform3fv(pBG.u.uLight,cur.light);
  gl.uniform1f(pBG.u.uCaustic,cur.caustic); gl.uniform1f(pBG.u.uRay,cur.ray);
  drawQuad(pBG);

  // poissons (du plus profond au plus proche)
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(pFISH);
  gl.uniform1f(pFISH.u.uAspect,ASPECT);
  const order=fishes.slice().sort((a,b)=>b.depth-a.depth);
  let bound=null;
  for(const f of order){
    const s=SPECIES[f.key];
    if(bound!==f.key){ gl.bindBuffer(gl.ARRAY_BUFFER,s.geom.buf);
      gl.enableVertexAttribArray(pFISH.a.aPos); gl.vertexAttribPointer(pFISH.a.aPos,2,gl.FLOAT,false,16,0);
      gl.enableVertexAttribArray(pFISH.a.aU);   gl.vertexAttribPointer(pFISH.a.aU,1,gl.FLOAT,false,16,8);
      gl.enableVertexAttribArray(pFISH.a.aSide);gl.vertexAttribPointer(pFISH.a.aSide,1,gl.FLOAT,false,16,12);
      bound=f.key; }
    const heading=Math.atan2(f.vy,f.vx), mirror=Math.cos(heading)<0?-1:1;
    const sp=Math.hypot(f.vx,f.vy)/(s.maxSpeed||1);
    const sc=s.len*f.scale*(0.78+0.34*(1.0-f.depth));     // proche = plus grand
    const fog=Math.min(0.85, s.depthFog*(0.4+f.depth));
    const soft=0.10+0.5*f.depth;                          // profond = flou (DoF)
    gl.uniform2f(pFISH.u.uPos,f.x,f.y);
    gl.uniform1f(pFISH.u.uScale,sc);
    gl.uniform1f(pFISH.u.uHeading,heading);
    gl.uniform1f(pFISH.u.uMirror,mirror);
    gl.uniform1f(pFISH.u.uPhase,f.phase);
    gl.uniform1f(pFISH.u.uAmp,0.05*(0.5+0.8*Math.min(1.5,sp)));
    gl.uniform1f(pFISH.u.uWaveK,s.wave);
    gl.uniform3fv(pFISH.u.uDorsal,s.dCol); gl.uniform3fv(pFISH.u.uBelly,s.bCol);
    gl.uniform3fv(pFISH.u.uTint,cur.mid);
    gl.uniform1f(pFISH.u.uFog,fog);
    gl.uniform1f(pFISH.u.uAlpha,1.0-0.15*f.depth);
    gl.uniform1f(pFISH.u.uSoft,soft);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,s.geom.count);
  }
  // bulles + nourriture (additif)
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
  drawPoints(pBUB, bubbles, b=>b.r*DPR*(0.6+0.8*b.y), p=>gl.uniform3fv(p.u.uLight, cur.light.map(v=>v*cur.bubble*2.0)));
  drawPoints(pFOOD, foods, ()=>3.2*DPR, null);
}

function blit(p,srcTex,dst,setU){
  gl.bindFramebuffer(gl.FRAMEBUFFER,dst?dst.fb:null);
  gl.viewport(0,0, dst?dst.w:W, dst?dst.h:H);
  gl.useProgram(p); gl.disable(gl.BLEND);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,srcTex);
  if(p.u.uTex) gl.uniform1i(p.u.uTex,0);
  if(setU) setU(p);
  drawQuad(p);
}

let last=performance.now(), tAcc=0;
function frame(now){
  const dt=Math.min(0.033,(now-last)/1000); last=now; tAcc+=dt;
  if(W===0) resize();
  stepTheme(dt); stepBoids(dt);

  if(usePost){
    gl.bindFramebuffer(gl.FRAMEBUFFER,sceneFBO.fb);
    drawScene(tAcc);
    // bloom : bright -> blur H -> blur V
    blit(pBRIGHT, sceneFBO.tex, brightFBO);
    blit(pBLUR, brightFBO.tex, blurA, p=>gl.uniform2f(p.u.uDir, 1/blurA.w, 0));
    blit(pBLUR, blurA.tex, blurB, p=>gl.uniform2f(p.u.uDir, 0, 1/blurB.h));
    // composite
    gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,W,H);
    gl.useProgram(pCOMP); gl.disable(gl.BLEND);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,sceneFBO.tex); gl.uniform1i(pCOMP.u.uScene,0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,blurB.tex); gl.uniform1i(pCOMP.u.uBloom,1);
    gl.uniform1f(pCOMP.u.uBloomAmt, 0.9); gl.uniform1f(pCOMP.u.uTime, tAcc);
    drawQuad(pCOMP);
  } else {
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    drawScene(tAcc);
  }
  requestAnimationFrame(frame);
}

/* ============================================================
   6. UI
   ============================================================ */
const panel=document.getElementById('panel'), gear=document.getElementById('gear');
gear.onclick=()=>panel.classList.toggle('open');
gear.onmouseenter=()=>panel.classList.add('open');
document.getElementById('feed').onclick=feed;

const rSpeed=document.getElementById('rSpeed'), vSpeed=document.getElementById('vSpeed');
rSpeed.oninput=e=>{ globalSpeed=+e.target.value; vSpeed.textContent=globalSpeed.toFixed(1)+'×'; };
const rDens=document.getElementById('rDens'), vDens=document.getElementById('vDens');
rDens.oninput=e=>{ vDens.textContent=e.target.value; setDensity(+e.target.value); };

function setTheme(t){ tgt=THEMES[t]; document.body.dataset.theme=t;
  document.querySelectorAll('[data-theme-btn]').forEach(b=>b.classList.toggle('active',b.dataset.themeBtn===t)); }
document.querySelectorAll('[data-theme-btn]').forEach(b=>b.onclick=()=>setTheme(b.dataset.themeBtn));

document.body.addEventListener('dblclick',()=>document.body.classList.toggle('wallpaper'));

/* ============================================================
   7. Démarrage
   ============================================================ */
resize();
setDensity(24);
requestAnimationFrame(frame);
</script>
